services:
  - type: web
    name: induport-trade
    runtime: node
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/induport.db
